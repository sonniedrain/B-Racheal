<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>B-RACHEAL — MD Login</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f4f6f8; font-family: Arial, Helvetica, sans-serif; color: #1f2937; } .login-container { width: 100%; max-width: 430px; padding: 20px; } .login-box { background: white; padding: 35px; border-radius: 8px; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); } .brand { text-align: center; font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 8px; } .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 15px; } .message { display: none; padding: 13px 15px; border-radius: 6px; margin-bottom: 18px; font-weight: 600; line-height: 1.4; } .message.success { display: block; background: #dcfce7; color: #166534; } .message.error { display: block; background: #fee2e2; color: #991b1b; } .message.loading { display: block; background: #e0f2fe; color: #075985; } .form-group { margin-bottom: 20px; } .form-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; } .form-group input { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; } .form-group input:focus { border-color: #2563eb; } .password-wrapper { position: relative; } .password-wrapper input { padding-right: 75px; } .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: #2563eb; font-weight: 600; cursor: pointer; padding: 5px; } .login-button { width: 100%; border: none; background: #2563eb; color: white; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 700; } .login-button:hover { background: #1d4ed8; } .login-button:disabled { opacity: 0.65; cursor: not-allowed; } .footer-text { text-align: center; margin-top: 22px; color: #64748b; font-size: 13px; } </style> </head> <body> <div class="login-container"> <div class="login-box"> <div class="brand"> B-RACHEAL </div> <div class="subtitle"> Medical Director Login </div> <div id="message" class="message" ></div> <form id="loginForm"> <div class="form-group"> <label for="username"> Username or Email </label> <input type="text" id="username" name="username" placeholder="Enter username or email" autocomplete="username" required > </div> <div class="form-group"> <label for="password"> Password </label> <div class="password-wrapper"> <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required > <button type="button" class="toggle-password" id="togglePassword" > Show </button> </div> </div> <button type="submit" class="login-button" id="loginButton" > Sign In </button> </form> <div class="footer-text"> B-RACHEAL Hospital Management System </div> </div> </div> <script> const API_BASE_URL = "http://127.0.0.1:3000/api"; const loginForm = document.getElementById( "loginForm" ); const usernameInput = document.getElementById( "username" ); const passwordInput = document.getElementById( "password" ); const togglePassword = document.getElementById( "togglePassword" ); const loginButton = document.getElementById( "loginButton" ); const message = document.getElementById( "message" ); function showMessage( text, type ) { message.textContent = text; message.className = "message " + type; } togglePassword.addEventListener( "click", function () { if ( passwordInput.type === "password" ) { passwordInput.type = "text"; togglePassword.textContent = "Hide"; } else { passwordInput.type = "password"; togglePassword.textContent = "Show"; } } ); loginForm.addEventListener( "submit", async function (event) { event.preventDefault(); const username = usernameInput.value.trim(); const password = passwordInput.value; if (!username) { showMessage( "Please enter your username or email.", "error" ); usernameInput.focus(); return; } if (!password) { showMessage( "Please enter your password.", "error" ); passwordInput.focus(); return; } loginButton.disabled = true; loginButton.textContent = "Signing in…"; showMessage( "Signing in…", "loading" ); try { const response = await fetch( API_BASE_URL + "/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: username, password: password, role: "md" }) } ); let data = {}; try { data = await response.json(); } catch (error) { data = {}; } if (!response.ok) { throw new Error( data.message || "Unable to sign in." ); } if ( !data.success || !data.token || !data.user ) { throw new Error( "Invalid login response from server." ); } if ( data.user.role !== "md" ) { throw new Error( "This account is not authorized for MD access." ); } localStorage.setItem( "bRachealToken", data.token ); localStorage.setItem( "bRachealUser", JSON.stringify( data.user ) ); showMessage( "Login successful. Opening MD dashboard…", "success" ); loginButton.textContent = "Opening dashboard…"; setTimeout( function () { window.location.href = "md-dashboard.html"; }, 500 ); } catch (error) { console.error( "MD login error:", error ); showMessage( error.message || "Unable to sign in.", "error" ); loginButton.disabled = false; loginButton.textContent = "Sign In"; } } ); </script> </body> </html>
