<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B-RACHEAL | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-box {
            background: #ffffff;
            border: 1px solid #dfe5ec;
            border-radius: 10px;
            padding: 35px 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            margin: 0;
            font-size: 30px;
            color: #123b63;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #344054;
        }

        input,
        select {
            width: 100%;
            height: 48px;
            border: 1px solid #cfd6df;
            border-radius: 6px;
            padding: 0 13px;
            font-size: 15px;
            background: #ffffff;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 85px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px;
        }

        .toggle-password:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 6px;
            background: #123b63;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #0d2d4d;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #027a48;
            border: 1px solid #abefc6;
        }

        .message.error {
            display: block;
            background: #fef3f2;
            color: #b42318;
            border: 1px solid #fecdca;
        }

        .message.loading {
            display: block;
            background: #eff8ff;
            color: #175cd3;
            border: 1px solid #b2ddff;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #667085;
        }

        .register-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 20px;
            }

            .logo h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <h1>B-RACHEAL</h1>
            </div>

            <div class="subtitle">
                Hospital Medical Records System
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username or Email</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Show
                        </button>

                    </div>
                </div>

                <div class="form-group">
                    <label for="accountType">Account Type</label>

                    <select id="accountType" name="accountType" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="staff">
                            Staff
                        </option>

                        <option value="md">
                            MD / Doctor
                        </option>

                    </select>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Sign In
                </button>

                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </form>

            <div class="register-link">
                Don't have a staff account?
                <a href="register.html">Create Staff Account</a>
            </div>

        </div>

    </div>


    <script>

        /*
         * B-RACHEAL LOGIN
         * JavaScript is intentionally inside this HTML file.
         */

        const API_BASE_URL = "http://127.0.0.1:3000/api";


        const loginForm = document.getElementById("loginForm");

        const usernameInput = document.getElementById("username");

        const passwordInput = document.getElementById("password");

        const accountTypeInput = document.getElementById("accountType");

        const togglePassword = document.getElementById("togglePassword");

        const loginButton = document.getElementById("loginButton");

        const loginMessage = document.getElementById("loginMessage");


        /*
         * SHOW / HIDE PASSWORD
         */

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.textContent = "Hide";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "Show";

            }

        });


        /*
         * DISPLAY MESSAGE
         */

        function showMessage(message, type) {

            loginMessage.textContent = message;

            loginMessage.className = "message " + type;

        }


        /*
         * LOGIN
         */

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const username = usernameInput.value.trim();

            const password = passwordInput.value;

            const role = accountTypeInput.value;


            /*
             * BASIC VALIDATION
             */

            if (!username) {

                showMessage(
                    "Please enter your username or email.",
                    "error"
                );

                usernameInput.focus();

                return;
            }


            if (!password) {

                showMessage(
                    "Please enter your password.",
                    "error"
                );

                passwordInput.focus();

                return;
            }


            if (!role) {

                showMessage(
                    "Please select your account type.",
                    "error"
                );

                accountTypeInput.focus();

                return;
            }


            /*
             * REACT IMMEDIATELY
             */

            loginButton.disabled = true;

            loginButton.textContent = "Signing in…";

            showMessage(
                "Signing in… Please wait.",
                "loading"
            );


            try {

                const response = await fetch(
                    `${API_BASE_URL}/auth/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password,
                            role: role
                        })
                    }
                );


                let data;

                try {

                    data = await response.json();

                } catch (jsonError) {

                    throw new Error(
                        "The server returned an invalid response."
                    );

                }


                /*
                 * SERVER ERROR
                 */

                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Login failed. Please check your details."
                    );

                }


                /*
                 * SAVE LOGIN INFORMATION
                 */

                localStorage.setItem(
                    "bRachealToken",
                    data.token
                );


                localStorage.setItem(
                    "bRachealUser",
                    JSON.stringify(data.user)
                );


                /*
                 * SUCCESS
                 */

                showMessage(
                    "Sign in successful. Opening your dashboard…",
                    "success"
                );


                loginButton.textContent = "Signed In";


                /*
                 * OPEN CORRECT DASHBOARD
                 */

                setTimeout(function () {

                    if (data.user.role === "staff") {

                        window.location.href = "staff-dashboard.html";

                    } else if (data.user.role === "md") {

                        window.location.href = "md-dashboard.html";

                    } else {

                        localStorage.removeItem("bRachealToken");

                        localStorage.removeItem("bRachealUser");

                        showMessage(
                            "Unknown account type.",
                            "error"
                        );

                        loginButton.disabled = false;

                        loginButton.textContent = "Sign In";

                    }

                }, 700);


            } catch (error) {

                console.error("Login error:", error);


                showMessage(
                    error.message ||
                    "Unable to connect to the B-RACHEAL server.",
                    "error"
                );


                loginButton.disabled = false;

                loginButton.textContent = "Sign In";

            }

        });

    </script>

</body>
</html>
